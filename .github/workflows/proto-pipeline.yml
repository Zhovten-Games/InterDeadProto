name: InterDeadProto Pipeline

on:
  push:
    branches: [ main, proto-dev ]
    paths:
      - "proto-dev/**"
      - ".github/workflows/proto-pipeline.yml"
      - ".github/scripts/apply-ci-overrides.sh"
  pull_request:
    branches: [ main, proto-dev ]
    paths:
      - "proto-dev/**"
      - ".github/workflows/proto-pipeline.yml"
      - ".github/scripts/apply-ci-overrides.sh"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build dist + ensure runtime + zip
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: proto-dev/package-lock.json

      - name: Install
        working-directory: proto-dev
        run: npm ci

      - name: Apply CI-only compatibility overrides
        shell: bash
        run: ./.github/scripts/apply-ci-overrides.sh

      - name: Build
        working-directory: proto-dev
        env:
          VITE_CACHE_BUILD_ID: ${{ github.sha }}
        run: npm run build:deploy

      - name: Mirror static assets to dist
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "proto-dev/dist/assets"
          cp -R "proto-dev/assets/." "proto-dev/dist/assets/"

          test -f "proto-dev/dist/assets/images/logo.png"
          test -f "proto-dev/dist/assets/audio/ghost_effect.mp3"

      - name: Ensure runtime libs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p "proto-dev/dist/assets/libs"
          mkdir -p "proto-dev/dist/assets/libs/db"

          # SQL.js WASM
          if [ ! -f "proto-dev/dist/assets/libs/db/sql-wasm.wasm" ]; then
            if [ -f "proto-dev/assets/libs/db/sql-wasm.wasm" ]; then
              cp "proto-dev/assets/libs/db/sql-wasm.wasm" "proto-dev/dist/assets/libs/db/sql-wasm.wasm"
            elif [ -f "assets/libs/db/sql-wasm.wasm" ]; then
              cp "assets/libs/db/sql-wasm.wasm" "proto-dev/dist/assets/libs/db/sql-wasm.wasm"
            elif [ -f "proto-dev/node_modules/sql.js/dist/sql-wasm.wasm" ]; then
              cp "proto-dev/node_modules/sql.js/dist/sql-wasm.wasm" "proto-dev/dist/assets/libs/db/sql-wasm.wasm"
            else
              echo "sql-wasm.wasm not found"
              exit 1
            fi
          fi

          # tf.min.js + coco-ssd.min.js
          for f in "tf.min.js" "coco-ssd.min.js"; do
            if [ ! -f "proto-dev/dist/assets/libs/${f}" ]; then
              if [ -f "proto-dev/assets/libs/${f}" ]; then
                cp "proto-dev/assets/libs/${f}" "proto-dev/dist/assets/libs/${f}"
              elif [ -f "assets/libs/${f}" ]; then
                cp "assets/libs/${f}" "proto-dev/dist/assets/libs/${f}"
              else
                echo "${f} not found"
                exit 1
              fi
            fi
          done

      - name: Ensure COCO-SSD model in dist (local hosting)
        shell: bash
        run: |
          set -euo pipefail

          SRC=""
          if [ -d "proto-dev/assets/models/coco-ssd" ]; then
            SRC="proto-dev/assets/models/coco-ssd"
          elif [ -d "assets/models/coco-ssd" ]; then
            SRC="assets/models/coco-ssd"
          else
            echo "COCO-SSD model folder not found in repo"
            exit 1
          fi

          mkdir -p "proto-dev/dist/assets/models/coco-ssd"
          cp -R "${SRC}/." "proto-dev/dist/assets/models/coco-ssd/"
          test -f "proto-dev/dist/assets/models/coco-ssd/model.json"

      - name: Ensure templates in dist (mirror proto-dev/src)
        shell: bash
        run: |
          set -euo pipefail

          SRC=""
          if [ -d "proto-dev/src/presentation/templates" ]; then
            SRC="proto-dev/src/presentation/templates"
          elif [ -d "src/presentation/templates" ]; then
            SRC="src/presentation/templates"
          else
            echo "templates source folder not found"
            exit 1
          fi

          mkdir -p "proto-dev/dist/src/presentation/templates"
          rm -rf "proto-dev/dist/src/presentation/templates" || true
          mkdir -p "proto-dev/dist/src/presentation/templates"
          cp -R "${SRC}/." "proto-dev/dist/src/presentation/templates/"

          test -f "proto-dev/dist/src/presentation/templates/welcome.html"

      - name: Ensure sw.js
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "proto-dev/dist/sw.js" ]; then
            if [ -f "proto-dev/sw.js" ]; then
              cp "proto-dev/sw.js" "proto-dev/dist/sw.js"
            elif [ -f "sw.js" ]; then
              cp "sw.js" "proto-dev/dist/sw.js"
            else
              echo "sw.js not found (will skip)"
              exit 0
            fi
          fi

      - name: Ensure favicon (from proto-dev/assets/favicons)
        shell: bash
        run: |
          set -euo pipefail

          if [ ! -f "proto-dev/dist/favicon.ico" ]; then
            if [ -f "proto-dev/assets/favicons/favicon.ico" ]; then
              cp "proto-dev/assets/favicons/favicon.ico" "proto-dev/dist/favicon.ico"
            elif [ -f "proto-dev/favicon.ico" ]; then
              cp "proto-dev/favicon.ico" "proto-dev/dist/favicon.ico"
            elif [ -f "favicon.ico" ]; then
              cp "favicon.ico" "proto-dev/dist/favicon.ico"
            fi
          fi

          test -f "proto-dev/dist/favicon.ico"

      - name: Patch dist (safe path fixes; strip sourcemaps)
        shell: bash
        run: |
          set -euo pipefail
          shopt -s globstar nullglob

          # Apply to all JS (incl. minified bundles), and index.html
          TARGETS=(proto-dev/dist/**/*.js proto-dev/dist/index.html)

          # 1) /src/... -> src/... (avoid domain root on GitHub Pages)
          perl -pi -e 's|"/src/|"src/|g; s|'\''/src/|'\''src/|g' "${TARGETS[@]}" || true

          # 2) ../i18n/... -> i18n/...  AND the broken "..i18n/..." -> i18n/...
          perl -pi -e 's|\.\./i18n/|i18n/|g; s|\.\.i18n/|i18n/|g' "${TARGETS[@]}" || true

          # 3) favicon absolute -> relative inside project
          perl -pi -e 's|href="/favicon\.ico"|href="favicon.ico"|g; s|href='\''/favicon\.ico'\''|href='\''favicon.ico'\''|g' proto-dev/dist/index.html || true

          # 4) Strip sourcemap markers and delete map files
          perl -pi -e 's@^\s*//# sourceMappingURL=.*$@@mg; s@/\*# sourceMappingURL=.*?\*/@@g' proto-dev/dist/**/*.js || true
          rm -f proto-dev/dist/**/*.map || true

      - name: Final fail-fast check for broken asset prefixes in dist
        shell: bash
        run: |
          set -euo pipefail

          if rg -n "/s/assets/" "proto-dev/dist"; then
            echo "Detected forbidden '/s/assets/' paths in final dist output."
            exit 1
          fi

          if rg -n "/s/assets/.*sql-wasm\.wasm|sql-wasm\.wasm.*?/s/assets/" "proto-dev/dist"; then
            echo "Detected SQL.js wasm reference with forbidden '/s/assets/' prefix."
            exit 1
          fi

          echo "No forbidden '/s/assets/' prefixes detected in final dist."

      - name: Verify key files
        shell: bash
        run: |
          set -euo pipefail
          test -f "proto-dev/dist/assets/libs/db/sql-wasm.wasm"
          test -f "proto-dev/dist/assets/libs/tf.min.js"
          test -f "proto-dev/dist/assets/libs/coco-ssd.min.js"
          test -f "proto-dev/dist/assets/models/coco-ssd/model.json"
          test -f "proto-dev/dist/src/presentation/templates/welcome.html"
          test -f "proto-dev/dist/assets/images/logo.png"
          test -f "proto-dev/dist/favicon.ico"

      - name: Create zip
        shell: bash
        run: |
          set -euo pipefail
          TAG="${GITHUB_SHA:0:8}"
          ZIP="InterDeadProto_${TAG}.zip"
          (cd proto-dev/dist && zip -r "../../${ZIP}" .)

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: proto-dev/dist

      - name: Upload zip
        uses: actions/upload-artifact@v4
        with:
          name: itch-zip
          path: InterDeadProto_*.zip

  deploy-proto:
    name: Deploy dist to proto branch
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@v4
        with:
          branch: proto
          folder: dist
          clean: true
          single-commit: true
          token: ${{ secrets.INTERDEAD_PROTO_DEPLOY_TOKEN }}

  deploy-itch:
    name: Deploy dist to itch.io via Butler
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download dist
        uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist

      - name: Install Butler
        shell: bash
        run: |
          set -euo pipefail
          # Butler pinned version — update manually when needed.
          BUTLER_URL="https://broth.itch.zone/butler/linux-amd64/v15.22.0/archive/default"
          curl -fL "$BUTLER_URL" -o butler.zip

          unzip -o butler.zip -d butler-bin
          chmod +x butler-bin/butler
          echo "$PWD/butler-bin" >> "$GITHUB_PATH"

      - name: Push build to itch.io
        shell: bash
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: |
          set -euo pipefail
          butler -V
          butler push dist zhovten-games/interdead:web
