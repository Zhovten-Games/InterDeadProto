name: InterDeadProto verified candidate and release

on:
  push:
    branches: [main, proto-dev]
    paths:
      - 'proto-dev/**'
      - 'build/**'
      - 'constitutional-guard/**'
      - 'governance/**'
      - 'manifest/**'
      - 'docs/**'
      - 'DEVELOPMENT.md'
      - 'LICENSE.md'
      - 'LICENSING-OVERRIDES.md'
      - 'codemap.manifest.json'
      - '.code-constitution'
      - '.licensing-policy'
      - '.github/**'
      - '.gitmodules'
      - '.nvmrc'
      - 'eslint.config.mjs'
      - '.prettierrc*'
      - '.prettierignore'
  pull_request:
    branches: [main, proto-dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interdead-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  candidate:
    name: Full WARDEN candidate (manual gates remain visible)
    runs-on: ubuntu-latest
    outputs:
      release-status: ${{ steps.verdict.outputs.release-status }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
          cache: npm
          cache-dependency-path: proto-dev/package-lock.json
      - name: Install exact toolchain and locked packages
        run: |
          npm install --global npm@11.9.0
          npm --prefix proto-dev ci
          ./proto-dev/node_modules/.bin/playwright install --with-deps chromium
      - name: Materialize optional external manual evidence
        shell: bash
        env:
          MANUAL_EVIDENCE: ${{ secrets.IRON_WARDEN_MANUAL_EVIDENCE_JSON }}
        run: |
          mkdir -p build/results
          if [ -n "$MANUAL_EVIDENCE" ]; then
            printf '%s' "$MANUAL_EVIDENCE" > build/results/manual-evidence.json
            echo "IRON_WARDEN_MANUAL_EVIDENCE_FILE=$PWD/build/results/manual-evidence.json" >> "$GITHUB_ENV"
          fi
      - name: Full lifecycle and release verdict
        id: warden
        continue-on-error: true
        run: npm --prefix proto-dev run check
      - name: Require all automatic candidate gates
        id: verdict
        run: |
          node build/verify-release.mjs --candidate
          node --input-type=module <<'JS'
          import { readFile, appendFile } from 'node:fs/promises';
          const report = JSON.parse(await readFile('build/results/warden-report.json', 'utf8'));
          await appendFile(process.env.GITHUB_OUTPUT, `release-status=${report.releaseStatus}\n`);
          await appendFile(process.env.GITHUB_STEP_SUMMARY, `Source candidate: automatic gates passed. Public release: **${report.releaseStatus}**.\n\n${report.blockers.map(row => `- ${row.id}: ${row.status}`).join('\n')}\n`);
          JS
      - name: Upload exact frozen distribution and ZIP
        if: success()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: idp-frozen-distribution
          path: build/output
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: idp-warden-evidence
          path: |
            build/results/warden-report.json
            build/results/distribution.json
            build/results/unit-tests.json
            build/results/source-check.json
            build/results/browser
          if-no-files-found: error

  deploy-proto:
    name: Publish verified tree to generated proto branch
    needs: candidate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.candidate.outputs.release-status == 'passed'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - run: |
          npm install --global npm@11.9.0
          npm --prefix proto-dev ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: idp-frozen-distribution
          path: build/output
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: idp-warden-evidence
          path: build/results
      - run: node build/verify-release.mjs
      - uses: JamesIves/github-pages-deploy-action@fa24774553152dd7873cd16ebd8d959b010c5445 # v4
        with:
          branch: proto
          folder: build/output/dist
          clean: true
          single-commit: true
          token: ${{ secrets.INTERDEAD_PROTO_DEPLOY_TOKEN }}

  deploy-itch:
    name: Publish the same verified tree via Butler
    needs: candidate
    if: github.event_name == 'push' && github.ref == 'refs/heads/main' && needs.candidate.outputs.release-status == 'passed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 24.19.0
      - run: |
          npm install --global npm@11.9.0
          npm --prefix proto-dev ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: idp-frozen-distribution
          path: build/output
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: idp-warden-evidence
          path: build/results
      - run: node build/verify-release.mjs
      - name: Install pinned Butler
        shell: bash
        run: |
          set -euo pipefail
          curl -fL "https://broth.itch.zone/butler/linux-amd64/15.24.0/archive/default" -o "$RUNNER_TEMP/butler.zip"
          unzip -q "$RUNNER_TEMP/butler.zip" -d "$RUNNER_TEMP/butler-bin"
          chmod +x "$RUNNER_TEMP/butler-bin/butler"
          "$RUNNER_TEMP/butler-bin/butler" -V | tee "$RUNNER_TEMP/butler-version.txt"
          rg '15\.24\.0' "$RUNNER_TEMP/butler-version.txt"
          echo "$RUNNER_TEMP/butler-bin" >> "$GITHUB_PATH"
      - name: Upload verified tree
        env:
          BUTLER_API_KEY: ${{ secrets.BUTLER_API_KEY }}
        run: butler push build/output/dist zhovten-games/interdead:web
